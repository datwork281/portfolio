<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lương Tiến Đạt - Portfolio</title>
    <style>
        /* Cài đặt màu sắc và font chữ mặc định */
        :root {
            --bg-dark: #0f1115;       /* Màu nền tối chính */
            --text-main: #ffffff;     /* Màu chữ chính */
            --text-muted: #8b949e;    /* Màu chữ phụ (chức danh) */
            --border-color: #30363d;  /* Màu viền */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Vùng chứa toàn bộ nội dung, căn giữa màn hình */
        .container {
            max-width: 800px;
            margin: 0 auto;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            min-height: 100vh;
        }

        /* Banner ngang */
        .banner {
            width: 100%;
            height: 220px;
            /* Ảnh banner tạm thời - bạn có thể thay link ảnh khác vào url() */
            background-image: url('https://images.unsplash.com/photo-1604079628040-94301bb21b91?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        /* Khu vực thông tin cá nhân */
        .profile-section {
            padding: 0 20px 20px 20px;
            position: relative;
            border-bottom: 1px solid var(--border-color);
        }

        /* Avatar tròn, đè lên banner */
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid var(--bg-dark); /* Tạo viền trùng màu nền để cắt banner */
            background-color: #1a1d24;
            margin-top: -65px; /* Kéo avatar lên trên banner một nửa */
            object-fit: cover;
            position: relative;
        }

        /* Tên và chức danh */
        .name {
            margin: 12px 0 4px 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .title {
            margin: 0;
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Tối ưu riêng cho màn hình điện thoại (Mobile) */
        @media (max-width: 600px) {
            .container {
                border-left: none;
                border-right: none;
            }
            .banner {
                height: 150px;
            }
            .avatar {
                width: 100px;
                height: 100px;
                margin-top: -50px;
            }
            .name {
                font-size: 22px;
            }
            .title {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Phần Header Mạng Xã Hội -->
        <header>
            <div class="banner"></div>
            <div class="profile-section">
                <!-- Thay link trong src="" bằng link ảnh avatar của bạn -->
                <img src="https://images.unsplash.com/photo-1535295972055-1c762f4483e5?q=80&w=500&auto=format&fit=crop" alt="Avatar" class="avatar">
                
                <h1 class="name">Lương Tiến Đạt</h1>
                <h2 class="title">Video Editor & Media Executive</h2>
            </div>
        </header>

        <!-- Các nội dung bổ sung (Portfolio, Phim) sẽ được thêm vào bên dưới dòng này -->

    </div>

</body>
</html>
